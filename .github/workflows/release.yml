name: Build Windows installer + Release v1.0.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: MaLickAsif/P-ReelForge
          token: ${{ secrets.SOURCE_PAT }}
          path: src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        working-directory: src
        run: |
          pyinstaller app.spec --noconfirm
          dist\ReelForge\ReelForge.exe --selftest

      - name: Compile Inno Setup installer
        working-directory: src
        run: |
          iscc installer\ReelForge.iss

      - name: Compute SHA256 and stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src\installer\Output\ReelForge-Setup-1.0.0.exe artifacts\
          $h = (Get-FileHash artifacts\ReelForge-Setup-1.0.0.exe -Algorithm SHA256).Hash
          "$h  ReelForge-Setup-1.0.0.exe" | Out-File artifacts\ReelForge-Setup-1.0.0.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ReelForge v1.0.0
          body: |
            ReelForge v1.0.0 — AI Video Studio for Windows.

            - Gmail-only signup with mandatory email verification
            - Real Supabase auth, teal/cyan design
            - SHA256 checksum included
          files: |
            artifacts/ReelForge-Setup-1.0.0.exe
            artifacts/ReelForge-Setup-1.0.0.exe.sha256
